name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用 Directory.Build.props 里的 Version）"
        required: false
        default: ""
      publish:
        description: "构建完直接发布到 Releases（true/false）"
        required: false
        default: "false"
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    # 打 MSI 失败时会把 msi-step.log 推到 ci-logs 分支（排查用），所以需要写权限
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) {
            [xml]$p = Get-Content Directory.Build.props
            $v = $p.Project.PropertyGroup.Version | Select-Object -First 1
          }
          if (-not $v) { throw "拿不到版本号" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - name: 单元测试
        run: dotnet run --project tests/ClassroomKit.Tests/ClassroomKit.Tests.csproj -c Release

      - name: 安装 WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: 单文件发布
        shell: pwsh
        run: ./scripts/build.ps1 -Output dist

      - name: 打 MSI
        id: msi
        shell: pwsh
        # 失败时不直接红掉，先把输出落盘，好让下一步推分支，方便看原因
        continue-on-error: true
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $ErrorActionPreference = "Stop"
          try {
            wix --version *>&1 | Tee-Object -FilePath msi-step.log
            ./scripts/build-msi.ps1 -Version "$v" -Dist dist *>&1 | Tee-Object -FilePath msi-step.log -Append
            if ($LASTEXITCODE -ne 0) { throw "build-msi.ps1 退出码 $LASTEXITCODE" }
            "MSI-OK" | Tee-Object -FilePath msi-step.log -Append
          } catch {
            "==== 失败 ====" | Tee-Object -FilePath msi-step.log -Append
            ($_ | Out-String) | Tee-Object -FilePath msi-step.log -Append
            exit 1
          }

      - name: 打 MSI 失败时把日志推到 ci-logs 分支
        if: steps.msi.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          Copy-Item msi-step.log ci-msi-step.log -Force
          git add -f ci-msi-step.log
          git commit -m "CI 日志 ${{ github.run_id }}（${{ steps.msi.outcome }}）"
          git push -f origin ci-logs

      - name: MSI 步骤失败就整体失败
        if: steps.msi.outcome == 'failure'
        run: exit 1

      - name: 打 ClassIsland 插件（cipx）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $manifest = "src/ClassroomKit.ClassIsland/manifest.yml"
          # 版本只有一个来源：发布时把 Directory.Build.props 的版本写进清单，再让构建去校验
          $text = Get-Content $manifest -Raw
          $text = $text -replace '(?m)^version:.*', "version: $v"
          Set-Content -Path $manifest -Value $text -NoNewline -Encoding UTF8
          dotnet publish src/ClassroomKit.ClassIsland/ClassroomKit.ClassIsland.csproj -c Release -p:Version="$v" -p:CreateCipx=true -p:GenerateHashSummary=true
          Copy-Item "src/ClassroomKit.ClassIsland/cipx/ClassroomKit.ClassIsland.cipx" "dist\ClassroomKit-$v.cipx" -Force
          Get-Item "dist\ClassroomKit-$v.cipx" | ForEach-Object { "{0}  {1:N0} 字节" -f $_.Name, $_.Length }

      - name: 打 zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $items = Get-ChildItem dist\* | Where-Object { $_.Extension -notin @('.msi', '.wixpdb', '.cipx') }
          Compress-Archive -Path $items -DestinationPath "dist\ClassroomKit-$v-win-x64.zip" -Force
          Get-ChildItem dist\ClassroomKit-*.zip | ForEach-Object { "{0}  {1:N0} 字节" -f $_.Name, $_.Length }

      - name: 校验产物
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $msi = "dist\ClassroomKit-$v-x64.msi"
          $zip = "dist\ClassroomKit-$v-win-x64.zip"
          $cipx = "dist\ClassroomKit-$v.cipx"
          if (-not (Test-Path $cipx)) { throw "缺少产物 $cipx" }
          $ci = Get-Item $cipx
          "{0}  {1:N0} 字节  sha256={2}" -f $ci.Name, $ci.Length, (Get-FileHash $cipx -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ci.Length -lt 30KB) { throw "cipx 太小，插件可能没打进去" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $cipx))
          try {
            $names = $zipArchive.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @('manifest.yml', 'ClassroomKit.ClassIsland.dll')) {
              if ($names -notcontains $required) { throw "cipx 里缺少 $required" }
            }
          } finally { $zipArchive.Dispose() }
          foreach ($f in @($msi, $zip)) {
            if (-not (Test-Path $f)) { throw "缺少产物 $f" }
            $i = Get-Item $f
            "{0}  {1:N0} 字节  sha256={2}" -f $i.Name, $i.Length, (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($i.Length -lt 50MB) { throw "$f 太小，构建可能没成功" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomKit-${{ steps.ver.outputs.version }}
          path: |
            dist/ClassroomKit-*-x64.msi
            dist/ClassroomKit-*-win-x64.zip
            dist/ClassroomKit-*.cipx
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ClassroomKit-${{ needs.windows.outputs.version }}

      - name: 列出产物
        run: ls -lh

      - name: 生成发布说明（只取当前版本）
        run: |
          awk 'BEGIN{p=0} /^# /{p=1} p&&/^## 历史/{exit} p' docs/release-notes.md > release-body.md
          wc -l release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: ClassroomKit ${{ needs.windows.outputs.version }}
          body_path: release-body.md
          files: |
            ClassroomKit-*-x64.msi
            ClassroomKit-*-win-x64.zip
            ClassroomKit-*.cipx
          draft: false
          # 重发同一版本时要覆盖同名资产（见 docs/版本与发布.md）
          overwrite_files: true
          prerelease: ${{ contains(needs.windows.outputs.version, '-') }}
